name: CI / deploy

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: api/go.mod }
      - name: API
        working-directory: api
        run: go vet ./... && go test -race ./...
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Web
        working-directory: web
        run: npm ci --no-audit --no-fund && npx nuxt typecheck

  deploy:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Деплои одного репозитория идут по очереди, новый не отменяет начатый.
    concurrency: { group: deploy-demo-blogger-crm, cancel-in-progress: false }
    steps:
      - name: Deploy to server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        # Ключ на сервере привязан к /opt/deploy.sh: команда — только имя проекта.
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes root@"$HOST" demo-blogger-crm
